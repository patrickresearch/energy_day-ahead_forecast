[project]
name = "energy-forecast"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "holidays>=0.60",
    "lightgbm>=4.5",
    "numpy>=2.0",
    "plotly>=6.0",
    "polars>=1.0",
    "requests>=2.32",
    "wandb>=0.19",
]

[dependency-groups]
dev = [
    "chronos-forecasting>=2.0",
    "ipykernel>=6.29",
    "kaleido>=1.0",
    "nbformat>=5.10",
    "ruff>=0.7",
    "streamlit>=1.50",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/energy_forecast"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"app/streamlit_app.py" = ["E402"]

[tool.ruff.lint.isort]
known-third-party = ["wandb"]
